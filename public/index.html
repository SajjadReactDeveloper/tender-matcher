<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tender Matcher</title>
<script>try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas:#e9eeec; --surface:#fff; --ink:#10222b; --mute:#566870; --line:#d3dcd8; --wash:#f3f6f5;
    --accent:#2b3fd6; --accent-ink:#fff;
    --high:#0a7f58; --med:#a96f00; --low:#667880; --urgent:#c93720;
    --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --body:"Figtree","Segoe UI",system-ui,sans-serif;
  }
  /* Dark applies when chosen with the toggle, or by system setting until a choice is made. */
  :root[data-theme=dark] {
    --canvas:#0d1518; --surface:#142126; --ink:#e6efec; --mute:#8ea3aa; --line:#243940; --wash:#101b1f;
    --accent:#8795ff; --accent-ink:#0d1518;
    --high:#3fd49b; --med:#e8b84a; --low:#8ea3aa; --urgent:#ff7b61;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme]) {
    --canvas:#0d1518; --surface:#142126; --ink:#e6efec; --mute:#8ea3aa; --line:#243940; --wash:#101b1f;
    --accent:#8795ff; --accent-ink:#0d1518;
    --high:#3fd49b; --med:#e8b84a; --low:#8ea3aa; --urgent:#ff7b61;
  } }
  .theme { padding:9px 10px; }
  .theme svg { width:18px; height:18px; display:block; }
  .theme .moon { display:none; }
  :root[data-theme=dark] .theme .sun { display:none; } :root[data-theme=dark] .theme .moon { display:block; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme]) .theme .sun { display:none; } :root:not([data-theme]) .theme .moon { display:block; } }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--canvas); color:var(--ink); font:15px/1.5 var(--body); -webkit-font-smoothing:antialiased; }
  .wrap { max-width:1180px; margin:0 auto; padding:24px 16px 72px; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; border-radius:6px; }

  /* header */
  header { display:flex; flex-wrap:wrap; gap:16px 24px; align-items:flex-end; justify-content:space-between; }
  .brand { display:flex; gap:12px; align-items:center; }
  .brand svg { width:34px; height:34px; flex:none; color:var(--accent); }
  h1 { margin:0; font:800 26px/1 var(--display); letter-spacing:-.02em; }
  .tag { margin:4px 0 0; color:var(--mute); font-size:13px; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .scan { display:flex; align-items:center; gap:8px; color:var(--mute); font-size:13px; }
  button, .btn, input, select { font:inherit; color:var(--ink); }
  input, select { background-color:var(--surface); border:1px solid var(--line); border-radius:8px; padding:0 12px; height:40px; }
  select { appearance:none; -webkit-appearance:none; cursor:pointer; padding-right:36px; font-weight:500;
    background-image:linear-gradient(45deg, transparent 50%, var(--mute) 50%), linear-gradient(135deg, var(--mute) 50%, transparent 50%);
    background-position:calc(100% - 19px) 50%, calc(100% - 14px) 50%; background-size:5px 5px; background-repeat:no-repeat; }
  select:hover, input:hover { border-color:var(--mute); }
  select option { background:var(--surface); color:var(--ink); }
  :root { color-scheme:light; } :root[data-theme=dark] { color-scheme:dark; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme]) { color-scheme:dark; } }
  input[type=number] { width:72px; }
  .btn, button.btn { display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border-radius:8px; border:1px solid var(--line); background:var(--surface); font-weight:600; cursor:pointer; text-decoration:none; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn:disabled { opacity:.55; cursor:default; }
  .btn:not(:disabled):hover { filter:brightness(.96); }

  /* run bar */
  .runbar { margin:18px 0 14px; display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; justify-content:space-between; color:var(--mute); font-size:14px; min-height:34px; }
  .runbar .msg { display:flex; align-items:center; gap:10px; min-width:0; }
  .runbar .msg span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .runbar.busy .msg { color:var(--ink); }
  .runbar.err .msg { color:var(--urgent); font-weight:600; }
  .spin { width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; flex:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .link { background:none; border:0; padding:4px 2px; color:var(--accent); cursor:pointer; font-weight:600; }
  #log { margin:0 0 14px; background:#0b1114; color:#c9d6d3; font:12px/1.55 ui-monospace,Consolas,monospace; padding:12px 14px; border-radius:10px; max-height:200px; overflow:auto; white-space:pre-wrap; }

  /* runway */
  .runway { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px 8px; margin-bottom:18px; }
  .runway-head { display:flex; justify-content:space-between; gap:12px; align-items:baseline; flex-wrap:wrap; }
  .runway h2 { margin:0; font:600 15px/1.2 var(--display); }
  .runway p { margin:0; color:var(--mute); font-size:13px; }
  #runway-svg { display:block; width:100%; height:150px; margin-top:6px; }
  #runway-svg text { font:12px var(--body); fill:var(--mute); }
  #runway-svg .axis { stroke:var(--line); stroke-width:1.5; }
  #runway-svg .tick { stroke:var(--line); stroke-width:1; }
  #runway-svg .now { stroke:var(--urgent); stroke-width:1.5; stroke-dasharray:3 3; }
  #runway-svg .now-label { fill:var(--urgent); font-weight:600; }
  #runway-svg .pin { cursor:pointer; color:var(--low); }
  #runway-svg .pin.High { color:var(--high); } #runway-svg .pin.Medium { color:var(--med); }
  #runway-svg .stem { stroke:currentColor; stroke-width:2; opacity:.55; }
  #runway-svg .dot { fill:currentColor; stroke:var(--surface); stroke-width:2; }
  #runway-svg .pin:hover .dot, #runway-svg .pin:focus-visible .dot { stroke:var(--ink); }
  #runway-svg .pin:focus-visible { outline:none; }

  /* filters */
  .filters { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px; }
  .seg { display:inline-flex; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:3px; }
  .seg button { border:0; background:none; height:32px; padding:0 12px; border-radius:7px; cursor:pointer; font-weight:500; color:var(--mute); }
  .seg button b { font-weight:600; margin-left:4px; }
  .seg button[aria-pressed=true] { background:var(--ink); color:var(--surface); }
  .filters input[type=search] { flex:1 1 220px; min-width:0; }
  .filters select { flex:0 0 auto; }

  /* list */
  .list { background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .item + .item { border-top:1px solid var(--line); }
  .row { all:unset; box-sizing:border-box; display:grid; grid-template-columns:52px minmax(0,1.6fr) 130px minmax(0,1.3fr); gap:8px 20px; align-items:start; width:100%; padding:16px 18px; cursor:pointer; }
  .item { --c:var(--low); } .item.High { --c:var(--high); } .item.Medium { --c:var(--med); }
  .item.open { background:var(--wash); box-shadow:inset 3px 0 0 var(--c); }
  .item.open .ring::before { background:var(--wash); }
  .row:hover { background:var(--wash); }
  .row:focus-visible { outline:3px solid var(--accent); outline-offset:-3px; border-radius:0; }
  .ring { --c:var(--low); width:46px; height:46px; border-radius:50%; display:grid; place-items:center; background:conic-gradient(var(--c) calc(var(--s) * 1%), var(--line) 0); position:relative; }
  .ring.High { --c:var(--high); } .ring.Medium { --c:var(--med); }
  .ring::before { content:""; position:absolute; inset:4px; border-radius:50%; background:var(--surface); }
  .row:hover .ring::before { background:var(--wash); }
  .ring b { position:relative; font:800 15px/1 var(--display); }
  .title { display:block; font:600 16px/1.3 var(--display); letter-spacing:-.005em; }
  .meta { display:block; margin-top:3px; color:var(--mute); font-size:13px; }
  .when b { display:block; font:800 18px/1.1 var(--display); letter-spacing:-.01em; }
  .when small { color:var(--mute); font-size:13px; }
  .when.soon b, .when.soon small { color:var(--urgent); }
  .when.closed b, .when.closed small { color:var(--mute); font-weight:600; }
  .verdict { display:flex; flex-direction:column; align-items:flex-start; gap:5px; min-width:0; }
  .chip { display:inline-block; padding:2px 11px; border-radius:20px; font-size:13px; font-weight:600; border:1.5px solid currentColor; }
  .chip.Bid { background:var(--high); border-color:var(--high); color:var(--surface); }
  .chip.Consider { color:var(--med); } .chip.Skip { color:var(--low); }
  .why { color:var(--mute); font-size:13px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .item.flash { animation:flash 1.2s ease-out; }
  @keyframes flash { from { background:color-mix(in srgb,var(--accent) 16%,transparent); } }

  /* detail */
  /* same columns as .row, so Details lines up under the verdict and the story under the title */
  .detail { padding:6px 18px 24px; display:grid; grid-template-columns:52px minmax(0,1.6fr) 130px minmax(0,1.3fr); gap:0 20px; animation:reveal .18s ease-out; }
  .detail .story { grid-column:2 / 4; }
  .detail .facts { grid-column:4; }
  @keyframes reveal { from { opacity:0; transform:translateY(-4px); } }
  .detail h3 { margin:0 0 6px; font:600 13px/1.2 var(--display); color:var(--mute); }
  .detail p { margin:0 0 18px; max-width:68ch; white-space:pre-wrap; }
  dl { margin:0 0 16px; display:grid; grid-template-columns:auto 1fr; gap:6px 16px; font-size:14px; }
  dt { color:var(--mute); } dd { margin:0; overflow-wrap:anywhere; }
  .docs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .docs a { color:var(--accent); font-weight:600; font-size:14px; text-decoration:none; padding:6px 11px; border:1px solid var(--line); border-radius:8px; }
  .docs a:hover { background:var(--wash); }
  .note { color:var(--mute); font-size:12.5px; max-width:48ch; }

  .empty { padding:56px 20px; text-align:center; color:var(--mute); }
  .empty b { display:block; color:var(--ink); font:600 18px var(--display); margin-bottom:6px; }

  @media (max-width:860px) {
    .row { grid-template-columns:52px 1fr auto; }
    .verdict { grid-column:2 / -1; }
    .detail { grid-template-columns:1fr; }
    .detail .story, .detail .facts { grid-column:1; }
    .detail .facts { margin-top:4px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg viewBox="0 0 34 34" fill="none" aria-hidden="true"><rect x="2" y="2" width="30" height="30" rx="9" stroke="currentColor" stroke-width="2.5"/><path d="M9 22l5-5 4 3 7-8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="25" cy="12" r="2.2" fill="currentColor"/></svg>
      <div><h1>Tender Matcher</h1><p class="tag">Active PPRA tenders, matched to Funavry</p></div>
    </div>
    <div class="controls">
      <label class="scan">Scan up to <input type="number" id="limit" value="150" min="1" max="3000"> new tenders</label>
      <button class="btn primary" id="run">Fetch latest tenders</button>
      <a class="btn" href="/api/export.xlsx" download>Download Excel</a>
      <button class="btn theme" id="theme" type="button" aria-label="Switch theme">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>
      </button>
    </div>
  </header>

  <section class="runbar" id="runbar" aria-live="polite">
    <div class="msg" id="runmsg"></div>
    <div><button class="link" id="stop" hidden>Stop run</button> <button class="link" id="logtoggle" hidden>Show log</button></div>
  </section>
  <pre id="log" hidden></pre>

  <section class="runway" id="runwaybox" hidden aria-label="Closing dates for the next 30 days">
    <div class="runway-head"><h2>Closing in the next 30 days</h2><p id="runway-note"></p></div>
    <svg id="runway-svg" role="group"></svg>
  </section>

  <div class="filters">
    <div class="seg" id="relseg" role="group" aria-label="Relevance"></div>
    <select id="when" aria-label="Closing date">
      <option value="open">Still open</option><option value="7">Closing in 7 days</option><option value="all">Include closed</option>
    </select>
    <select id="sort" aria-label="Sort by">
      <option value="closing">Closing soonest</option><option value="fit">Best fit first</option><option value="posted">Newest posted</option>
    </select>
    <input type="search" id="q" placeholder="Search name, department or scope" aria-label="Search tenders">
  </div>

  <div class="list" id="list"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const DAY = 864e5, SPAN = 30;
const midnight = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const daysLeft = (iso) => Math.round((new Date(iso + 'T00:00:00') - midnight()) / DAY);
const fmt = (iso) => { const d = new Date(iso + 'T00:00:00'); return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', ...(d.getFullYear() !== new Date().getFullYear() && { year: 'numeric' }) }); };
const verdictOf = (t) => (/^\s*(bid|consider|skip)/i.exec(t.recommendation || '')?.[1] || '').replace(/^./, (c) => c.toUpperCase());
const whyOf = (t) => (t.recommendation || '').replace(/^\s*(bid|consider|skip)\W*/i, '').replace(/^./, (c) => c.toUpperCase());
const colorClass = (r) => (['High', 'Medium'].includes(r) ? r : 'Low');

let tenders = [], openId = null, rel = '', status = { running: false }, lastRaw = '';

function visible() {
  const w = $('when').value, q = $('q').value.toLowerCase().trim(), sort = $('sort').value;
  const list = tenders.filter((t) => {
    const d = daysLeft(t.lastDate);
    return (w === 'all' || d >= 0) && (w !== '7' || d <= 7) &&
      (!q || [t.name, t.department, t.scope, t.refNo, t.recommendation].join(' ').toLowerCase().includes(q));
  });
  const closed = (t) => daysLeft(t.lastDate) < 0;
  const by = { closing: (a, b) => closed(a) - closed(b) || a.lastDate.localeCompare(b.lastDate),
               fit: (a, b) => b.score - a.score, posted: (a, b) => b.postingDate.localeCompare(a.postingDate) };
  return list.sort(by[sort]);
}

function renderSeg(list) {
  const n = (r) => list.filter((t) => !r || t.relevance === r).length;
  $('relseg').innerHTML = [['', 'All'], ['High', 'High'], ['Medium', 'Medium'], ['Low', 'Low']]
    .map(([v, l]) => `<button data-rel="${v}" aria-pressed="${rel === v}">${l}<b>${n(v)}</b></button>`).join('');
}

function itemHtml(t) {
  const d = daysLeft(t.lastDate), v = verdictOf(t), isOpen = openId === t.id;
  const when = d < 0 ? ['closed', 'Closed', ''] : [d <= 3 ? 'soon' : '', fmt(t.lastDate), d === 0 ? 'today' : d === 1 ? 'tomorrow' : `in ${d} days`];
  const docs = t.docs || {}, P = 'https://epms.ppra.gov.pk';
  const facts = [['Closes', `${fmt(t.lastDate)} ${t.closingTime || ''}`], ['Posted', fmt(t.postingDate)], ['Type', [t.type, t.nature, t.category].filter(Boolean).join(', ')],
    ['Procedure', t.procedure], ['Bid security', t.bidSecurity], ['Bid validity', t.bidValidity], ['Contact', t.contact], ['Tender no.', t.refNo]].filter(([, x]) => x);
  return `<article class="item ${colorClass(t.relevance)}${isOpen ? ' open' : ''}" data-id="${esc(t.id)}">
    <button class="row" aria-expanded="${isOpen}">
      <span class="ring ${colorClass(t.relevance)}" style="--s:${Number(t.score) || 0}" title="Fit score ${esc(t.score)} out of 100, relevance ${esc(t.relevance)}"><b>${esc(t.score)}</b></span>
      <span><span class="title">${esc(t.name)}</span><span class="meta">${esc(t.department)}</span></span>
      <span class="when ${when[0]}"><b>${esc(when[1])}</b><small>${when[2]}</small></span>
      <span class="verdict">${v ? `<span class="chip ${v}">${v}</span>` : ''}<span class="why">${esc(whyOf(t))}</span></span>
    </button>
    ${isOpen ? `<div class="detail">
      <div class="story"><h3>Recommendation</h3><p>${esc(whyOf(t))}</p><h3>Scope</h3><p>${esc(t.scope)}</p><h3>Dependencies and challenges</h3><p>${esc(t.challenges)}</p></div>
      <div class="facts"><h3>Details</h3><dl>${facts.map(([k, x]) => `<dt>${k}</dt><dd>${esc(x)}</dd>`).join('')}</dl>
        <div class="docs"><a href="${esc(t.url)}" target="_blank" rel="noopener">PPRA page</a>
          ${docs.advertisement ? `<a href="${P}${esc(docs.advertisement)}" target="_blank" rel="noopener" title="Opens the advertisement PDF">Advertisement</a>` : ''}
          ${docs.tender ? `<a href="${P}${esc(docs.tender)}" target="_blank" rel="noopener" title="Opens the tender document PDF">Tender document</a>` : ''}</div>
        <p class="note">Score, scope and recommendation are AI estimates from ${docs.pagesRead || 0} scanned page${docs.pagesRead === 1 ? '' : 's'}. Check the documents before you bid.</p></div>
    </div>` : ''}
  </article>`;
}

function renderRunway() {
  const open = tenders.filter((t) => daysLeft(t.lastDate) >= 0);
  const box = $('runwaybox'), svg = $('runway-svg');
  box.hidden = !open.length;
  if (!open.length) return;
  const W = svg.clientWidth || 900, H = 150, pad = 26, base = H - 34, x = (d) => pad + (Math.min(d, SPAN) / SPAN) * (W - pad * 2);
  const slots = {}; let later = 0, out = '';
  for (let d = 0; d <= SPAN; d += 7) {
    const label = d === 0 ? '' : fmt(new Date(midnight().getTime() + d * DAY).toLocaleDateString('en-CA'));
    out += `<line class="tick" x1="${x(d)}" x2="${x(d)}" y1="${base}" y2="${base + 6}"/>${label ? `<text x="${x(d)}" y="${H - 8}" text-anchor="middle">${label}</text>` : ''}`;
  }
  out = `<line class="axis" x1="${pad}" x2="${W - pad}" y1="${base}" y2="${base}"/>` + out +
    `<line class="now" x1="${x(0)}" x2="${x(0)}" y1="14" y2="${base}"/><text class="now-label" x="${x(0) + 6}" y="${H - 8}">Today</text>`;
  for (const t of open.sort((a, b) => a.score - b.score)) {
    const d = daysLeft(t.lastDate); if (d > SPAN) { later++; continue; }
    const k = (slots[d] = (slots[d] || 0) + 1) - 1, cx = x(d) + k * 15, h = 14 + (t.score / 100) * (base - 34);
    out += `<g class="pin ${colorClass(t.relevance)}" data-id="${esc(t.id)}" tabindex="0" role="button" aria-label="${esc(t.name)}, closes ${fmt(t.lastDate)}, score ${esc(t.score)}">
      <title>${esc(t.name)}\nCloses ${fmt(t.lastDate)}, score ${esc(t.score)}</title>
      <line class="stem" x1="${cx}" x2="${cx}" y1="${base}" y2="${base - h}"/><circle class="dot" cx="${cx}" cy="${base - h}" r="8"/></g>`;
  }
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.innerHTML = out;
  $('runway-note').textContent = `Taller pins fit better${later ? `. ${later} more close later.` : '.'}`;
}

function render() {
  const base = tenders.filter((t) => { const w = $('when').value, d = daysLeft(t.lastDate); return w === 'all' || d >= 0; });
  renderSeg(base);
  const list = visible().filter((t) => !rel || t.relevance === rel);
  $('list').innerHTML = list.length ? list.map(itemHtml).join('') :
    tenders.length ? '<div class="empty"><b>Nothing matches these filters</b>Clear the search or widen the closing date.</div>'
                   : '<div class="empty"><b>No matched tenders yet</b>Fetch the latest tenders to screen new PPRA notices against the Funavry profile.</div>';
  renderRunway();
}

function openTender(id) {
  openId = openId === id ? null : id; render();
  if (openId) { const el = document.querySelector(`.item[data-id="${CSS.escape(id)}"]`); el?.scrollIntoView({ block: 'center', behavior: 'smooth' }); el?.classList.add('flash'); }
}
$('list').onclick = (e) => { const r = e.target.closest('.row'); if (r) openTender(r.closest('.item').dataset.id); };
$('runway-svg').onclick = (e) => { const p = e.target.closest('.pin'); if (p) { rel = ''; openTender(p.dataset.id); } };
$('runway-svg').onkeydown = (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('.pin')) { e.preventDefault(); e.target.closest('.pin').dispatchEvent(new MouseEvent('click', { bubbles: true })); } };
$('relseg').onclick = (e) => { const b = e.target.closest('button'); if (b) { rel = b.dataset.rel; render(); } };
['q', 'when', 'sort'].forEach((id) => ($(id).oninput = render));
addEventListener('resize', renderRunway);

const isDark = () => (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
$('theme').onclick = () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('theme', next); } catch {}
  $('theme').title = $('theme').ariaLabel = `Switch to ${next === 'dark' ? 'light' : 'dark'} theme`;
};
$('theme').title = $('theme').ariaLabel = `Switch to ${isDark() ? 'light' : 'dark'} theme`;

let logShown = false;
$('logtoggle').onclick = () => { logShown = !logShown; paintStatus(); };
function paintStatus() {
  const s = status, last = (s.log[s.log.length - 1] || '').replace(/^\S+ [AP]M\s+/, '').trim();
  $('runbar').className = 'runbar' + (s.running ? ' busy' : s.error ? ' err' : '');
  $('runmsg').innerHTML = s.running ? `<i class="spin"></i><span>${esc(last || 'Starting...')}</span>`
    : s.error ? `<span role="alert">${esc(s.error)}</span>`
    : `<span>${s.matched} matched of ${s.screened} tenders screened. AI: ${esc(s.provider)}.</span>`;
  $('run').disabled = s.running; $('run').textContent = s.running ? 'Running...' : 'Fetch latest tenders';
  $('stop').hidden = !s.running;
  $('logtoggle').hidden = !s.log.length; $('logtoggle').textContent = logShown ? 'Hide log' : 'Show log';
  const log = $('log'), atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 24;
  log.hidden = !(logShown && s.log.length); log.textContent = s.log.join('\n'); if (atEnd) log.scrollTop = log.scrollHeight;
}

async function refresh(force) {
  try {
    status = await (await fetch('/api/status')).json(); paintStatus();
    if (force || status.running || status.matched !== tenders.length) {
      const raw = await (await fetch('/api/tenders')).text();
      if (raw !== lastRaw) { lastRaw = raw; tenders = JSON.parse(raw); render(); } // skip re-render when nothing changed, so open rows and text selection stay put
    }
  } catch { $('runmsg').textContent = 'Cannot reach the app. Is start.bat still running?'; }
}
$('run').onclick = async () => { await fetch('/api/run', { method: 'POST', body: JSON.stringify({ limit: $('limit').value }) }); refresh(); };
$('stop').onclick = () => fetch('/api/stop', { method: 'POST' });
refresh(true); setInterval(refresh, 2500);
</script>
</body>
</html>
